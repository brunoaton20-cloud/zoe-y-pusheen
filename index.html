<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Zoe y los abrazos 💕</title>
  <style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  background: #ffe3ef; font-family: "Trebuchet MS", "Comic Sans MS", sans-serif; color: #7a3b5a;
  user-select: none; touch-action: manipulation;
}
h1 { margin: 14px 0 8px; font-size: 1.6rem; }
#wrap { width: min(96vw, 800px); border: 6px solid #fff; border-radius: 22px; overflow: hidden;
  box-shadow: 0 8px 24px rgba(200, 80, 130, .3); }
canvas { display: block; width: 100%; height: auto; background: #fff6fa; }
.help { margin: 10px 14px; text-align: center; font-size: .95rem; }
#pad { display: none; width: min(96vw, 800px); justify-content: space-between; align-items: center; padding: 6px 10px 20px; }
.dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
.up { grid-column: 2; grid-row: 1; } .left { grid-column: 1; grid-row: 2; }
.right { grid-column: 3; grid-row: 2; } .down { grid-column: 2; grid-row: 3; }
button { border: none; border-radius: 16px; background: #ff8fb8; color: #fff; font-size: 1.3rem;
  box-shadow: 0 4px 0 #d95f90; }
button:active { transform: translateY(3px); box-shadow: 0 1px 0 #d95f90; }
.hug { padding: 22px 26px; font-size: 1.2rem; }
@media (pointer: coarse) { #pad { display: flex; } .help { display: none; } }

</style>
</head>
<body>
  <h1>🐱 Zoe y los abrazos 💕</h1>
  <div id="wrap">
    <canvas id="game" width="800" height="500"></canvas>
  </div>
  <p class="help">Mové a Zoe con <b>← ↑ → ↓</b> o <b>WASD</b>. Acercate al gatito y apretá <b>ESPACIO</b> para abrazarlo.</p>

  <div id="pad">
    <div class="dpad">
      <button data-key="ArrowUp" class="up">▲</button>
      <button data-key="ArrowLeft" class="left">◀</button>
      <button data-key="ArrowRight" class="right">▶</button>
      <button data-key="ArrowDown" class="down">▼</button>
    </div>
    <button data-key=" " class="hug">🤗 Abrazar</button>
  </div>

  <script>
// ================== CONFIGURACIÓN ==================
const CAT_NAME  = "Gatito";   // 👈 cambiale el nombre al gato acá
const ZOE_NAME  = "Zoe";
const PHRASES = [
  "¡Miau~! 💕", "Mrrrr... 😽", "Más abrazos porfi 🥺", "¡Te quiero, " + ZOE_NAME + "!",
  "Qué calentito... ☁️", "Nyaaa~ ✨", "Prrrr prrrr 💗", "¡Sos la mejor! 🌸",
  "Mimitos, mimitos 🐾", "Miii miii~ 🥰", "Soy feliz 🌈", "Otro más, otro más 💞"
];
const MILESTONES = {
  5:  "¡5 abrazos! Ya somos amigos 💖",
  10: "¡10 abrazos! Me derrito 🫠💕",
  25: "¡25 abrazos! Sos mi persona favorita 🌟",
  50: "¡50 abrazos! Nunca me sueltes 🥹💗"
};

// ================== SETUP ==================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const FLOOR_TOP = 280;

const keys = {};
const zoe = { x: 200, y: 390, dir: 1, walk: 0 };
const cat = { x: 540, y: 390, tx: 540, ty: 390, wait: 1, dir: -1 };
let hugTimer = 0, hugs = 0, love = 0, time = 0;
let bubble = { text: "¡Hola! Abrazame 🐾", t: 3 };
let toast = { text: "", t: 0 };
let hint = 0;
const hearts = [];

// ================== AUDIO (sintetizado, sin archivos) ==================
let audio;
function initAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === "suspended") audio.resume();
}
function tone(freqs, dur, type = "sine", vol = 0.18, delay = 0) {
  if (!audio) return;
  const t0 = audio.currentTime + delay;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type;
  freqs.forEach((f, i) => o.frequency.linearRampToValueAtTime(f, t0 + (dur * i) / (freqs.length - 1 || 1)));
  o.frequency.setValueAtTime(freqs[0], t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.04);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(audio.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function meow() {          // "miau" agudito
  const base = 700 + Math.random() * 200;
  tone([base, base * 1.5, base * 0.9], 0.45, "triangle", 0.2);
  tone([base * 2, base * 3, base * 1.8], 0.45, "sine", 0.05);
}
function squeak() {        // "mii" tierno
  const b = 1000 + Math.random() * 300;
  tone([b, b * 1.25], 0.18, "sine", 0.16);
  tone([b * 1.1, b * 1.4], 0.18, "sine", 0.12, 0.2);
}
function purr(len = 1.3) { // ronroneo
  if (!audio) return;
  const t0 = audio.currentTime;
  const o = audio.createOscillator(), g = audio.createGain(), lfo = audio.createOscillator(), lg = audio.createGain();
  o.type = "sawtooth"; o.frequency.value = 55;
  lfo.frequency.value = 22; lg.gain.value = 0.05;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.07, t0 + 0.2);
  g.gain.linearRampToValueAtTime(0.0001, t0 + len);
  lfo.connect(lg).connect(g.gain);
  o.connect(g).connect(audio.destination);
  o.start(t0); lfo.start(t0); o.stop(t0 + len + 0.1); lfo.stop(t0 + len + 0.1);
}
function chime() { [660, 880, 1100, 1320].forEach((f, i) => tone([f, f], 0.25, "sine", 0.1, i * 0.1)); }

// ================== INPUT ==================
addEventListener("keydown", e => {
  initAudio();
  if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (!keys[k] && (k === " ")) tryHug();
  keys[k] = true;
});
addEventListener("keyup", e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
document.querySelectorAll("#pad button").forEach(b => {
  const k = b.dataset.key;
  const down = e => { e.preventDefault(); initAudio(); if (k === " ") tryHug(); else keys[k] = true; };
  const up = e => { e.preventDefault(); keys[k] = false; };
  b.addEventListener("touchstart", down, { passive: false });
  b.addEventListener("touchend", up); b.addEventListener("touchcancel", up);
  b.addEventListener("mousedown", down); b.addEventListener("mouseup", up); b.addEventListener("mouseleave", up);
});

// ================== LÓGICA ==================
function say(text, t = 2.2) { bubble = { text, t }; }
function dist() { return Math.hypot(zoe.x - cat.x, (zoe.y - cat.y) * 1.6); }

function tryHug() {
  if (hugTimer > 0) return;
  if (dist() > 120) { hint = 1.2; return; }
  hugTimer = 1.7; hugs++; love = Math.min(100, love + 6);
  zoe.dir = cat.x >= zoe.x ? 1 : -1;
  zoe.x = cat.x - zoe.dir * 62; zoe.y = cat.y + 4;
  cat.dir = -zoe.dir;
  say(MILESTONES[hugs] || PHRASES[Math.floor(Math.random() * PHRASES.length)], 2.4);
  meow(); setTimeout(squeak, 350); purr(1.5);
  for (let i = 0; i < 10; i++) hearts.push({
    x: cat.x + (Math.random() - 0.5) * 90, y: cat.y - 40 - Math.random() * 30,
    vy: 40 + Math.random() * 50, life: 1.6 + Math.random(), s: 16 + Math.random() * 18,
    c: ["💖", "💕", "💗", "💞", "🌸"][Math.floor(Math.random() * 5)]
  });
  if (MILESTONES[hugs]) { toast = { text: MILESTONES[hugs], t: 3 }; setTimeout(chime, 500); }
}

function update(dt) {
  time += dt;
  if (hugTimer > 0) hugTimer -= dt;
  else {
    let dx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    let dy = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
    if (dx || dy) {
      const l = Math.hypot(dx, dy), sp = 210;
      zoe.x += (dx / l) * sp * dt; zoe.y += (dy / l) * sp * dt;
      if (dx) zoe.dir = dx; zoe.walk += dt * 12;
    }
    zoe.x = Math.max(50, Math.min(W - 50, zoe.x));
    zoe.y = Math.max(FLOOR_TOP + 60, Math.min(H - 30, zoe.y));

    // el gato pasea tranquilo
    cat.wait -= dt;
    if (cat.wait <= 0) {
      cat.tx = 80 + Math.random() * (W - 160);
      cat.ty = FLOOR_TOP + 70 + Math.random() * 130;
      cat.wait = 2.5 + Math.random() * 3;
    }
    const cx = cat.tx - cat.x, cy = cat.ty - cat.y, cd = Math.hypot(cx, cy);
    if (cd > 4) { cat.x += (cx / cd) * 38 * dt; cat.y += (cy / cd) * 38 * dt; cat.dir = cx > 0 ? 1 : -1; }
    // si Zoe está cerca, a veces dice algo tierno solito
    if (bubble.t <= 0 && dist() < 140 && Math.random() < dt * 0.25) { squeak(); say("¡Mii! ¿Un abrazo? 🥺", 2); }
  }
  if (bubble.t > 0) bubble.t -= dt;
  if (toast.t > 0) toast.t -= dt;
  if (hint > 0) hint -= dt;
  love = Math.max(0, love - dt * 0.6);
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i]; h.y -= h.vy * dt; h.life -= dt;
    if (h.life <= 0) hearts.splice(i, 1);
  }
}

// ================== DIBUJO ==================
function ellipse(x, y, rx, ry, fill, stroke) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.stroke(); }
}

function drawBackground() {
  ctx.fillStyle = "#ffeaf3"; ctx.fillRect(0, 0, W, FLOOR_TOP);
  ctx.fillStyle = "#ffd0e3";
  for (let x = 0; x < W; x += 80) for (let y = 0; y < FLOOR_TOP; y += 80) {
    ellipse(x + 40, y + 40, 6, 6, "#ffd0e3");
  }
  // ventana
  ctx.fillStyle = "#bfe8ff"; ctx.fillRect(560, 50, 150, 120);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 8; ctx.strokeRect(560, 50, 150, 120);
  ctx.beginPath(); ctx.moveTo(635, 50); ctx.lineTo(635, 170); ctx.moveTo(560, 110); ctx.lineTo(710, 110); ctx.stroke();
  ellipse(600, 85, 22, 12, "#fff"); ellipse(620, 80, 18, 12, "#fff");
  // piso
  ctx.fillStyle = "#ffc9a8"; ctx.fillRect(0, FLOOR_TOP, W, H - FLOOR_TOP);
  ctx.strokeStyle = "#f0b08c"; ctx.lineWidth = 2;
  for (let y = FLOOR_TOP + 40; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  // alfombra
  ellipse(400, 410, 260, 60, "#ffb3d1"); ellipse(400, 410, 220, 46, "#ffd1e4");
  // lámpara/planta decorativa
  ctx.fillStyle = "#c98b5e"; ctx.fillRect(60, 200, 40, 50);
  ellipse(80, 190, 34, 30, "#8fd694"); ellipse(62, 175, 20, 22, "#7bc880"); ellipse(100, 178, 20, 22, "#7bc880");
}

function drawCat() {
  const hugging = hugTimer > 0;
  const sq = hugging ? 1 + Math.sin(time * 14) * 0.05 : 1 + Math.sin(time * 3) * 0.02;
  const { x, y, dir } = cat;
  ellipse(x, y + 38, 62, 12, "rgba(0,0,0,.12)");
  ctx.save(); ctx.translate(x, y); ctx.scale(dir * (2 - sq), sq); // la sombra no se voltea, el gato sí
  const G = "#b8b8c6", D = "#8f8fa3", O = "#6c6c80";
  // cola
  ctx.beginPath(); ctx.moveTo(-50, 10);
  ctx.bezierCurveTo(-95, 0 + Math.sin(time * 4) * 8, -95, -40, -70, -45);
  ctx.lineWidth = 16; ctx.lineCap = "round"; ctx.strokeStyle = G; ctx.stroke();
  // cuerpo
  ellipse(0, 0, 62, 44, G, O);
  // orejas
  [[-34, 1], [34, -1]].forEach(([ex]) => {
    ctx.beginPath(); ctx.moveTo(ex - 16, -28); ctx.lineTo(ex + (ex < 0 ? -2 : 2), -62); ctx.lineTo(ex + 16, -30);
    ctx.closePath(); ctx.fillStyle = G; ctx.fill(); ctx.strokeStyle = O; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex - 8, -32); ctx.lineTo(ex + (ex < 0 ? -1 : 1), -52); ctx.lineTo(ex + 9, -33);
    ctx.fillStyle = "#ffb8cf"; ctx.fill();
  });
  // rayitas
  ctx.strokeStyle = D; ctx.lineWidth = 5; ctx.lineCap = "round";
  [-16, 0, 16].forEach(sx => { ctx.beginPath(); ctx.moveTo(sx, -42); ctx.lineTo(sx, -30); ctx.stroke(); });
  [[-52, -8], [-52, 6]].forEach(([sx, sy]) => { ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 12, sy); ctx.stroke(); });
  [[52, -8], [52, 6]].forEach(([sx, sy]) => { ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - 12, sy); ctx.stroke(); });
  // carita
  ctx.strokeStyle = "#333"; ctx.fillStyle = "#333"; ctx.lineWidth = 3;
  if (hugging) {
    [-26, 26].forEach(ex => { ctx.beginPath(); ctx.arc(ex, -4, 7, Math.PI, 0); ctx.stroke(); });
  } else {
    ellipse(-26, -4, 4.5, 5.5, "#222"); ellipse(26, -4, 4.5, 5.5, "#222");
    ellipse(-24.5, -6, 1.5, 1.5, "#fff"); ellipse(27.5, -6, 1.5, 1.5, "#fff");
  }
  ellipse(-42, 8, 9, 5, "rgba(255,130,170,.55)"); ellipse(42, 8, 9, 5, "rgba(255,130,170,.55)");
  ellipse(0, 2, 3.5, 2.5, "#ff9ab8");
  ctx.beginPath(); ctx.moveTo(0, 5); ctx.quadraticCurveTo(-6, 13, -12, 6);
  ctx.moveTo(0, 5); ctx.quadraticCurveTo(6, 13, 12, 6); ctx.strokeStyle = "#333"; ctx.stroke();
  // bigotes
  ctx.lineWidth = 1.5;
  [[-58, 0, -36, 3], [-58, 10, -36, 8], [58, 0, 36, 3], [58, 10, 36, 8]].forEach(([a, b, c, d]) => {
    ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke();
  });
  // patitas
  ellipse(-28, 40, 14, 8, G, O); ellipse(28, 40, 14, 8, G, O);
  ctx.restore();
}

function drawZoe() {
  const { x, y, dir } = zoe, hugging = hugTimer > 0;
  const bob = Math.abs(Math.sin(zoe.walk)) * 3;
  ellipse(x, y + 62, 30, 8, "rgba(0,0,0,.12)");
  ctx.save(); ctx.translate(x, y - bob);
  // piernas
  const sw = Math.sin(zoe.walk) * 6;
  ctx.fillStyle = "#ffe0c7"; ctx.fillRect(-12 + sw, 38, 8, 20); ctx.fillRect(4 - sw, 38, 8, 20);
  ellipse(-8 + sw, 60, 10, 5, "#ff6fa5"); ellipse(8 - sw, 60, 10, 5, "#ff6fa5");
  // vestido
  ctx.beginPath(); ctx.moveTo(-14, -8); ctx.lineTo(14, -8); ctx.lineTo(28, 42); ctx.lineTo(-28, 42); ctx.closePath();
  ctx.fillStyle = "#ff8fc0"; ctx.fill(); ctx.strokeStyle = "#e0609a"; ctx.lineWidth = 3; ctx.stroke();
  ellipse(0, 12, 4, 4, "#fff");
  // coletas
  ellipse(-28, -22, 11, 20, "#6b3f2a"); ellipse(28, -22, 11, 20, "#6b3f2a");
  // brazos
  ctx.lineCap = "round"; ctx.lineWidth = 9; ctx.strokeStyle = "#ffe0c7";
  ctx.beginPath();
  if (hugging) { ctx.moveTo(dir * 12, -2); ctx.lineTo(dir * 50, 6); ctx.moveTo(dir * -12, -2); ctx.lineTo(dir * 44, 22); }
  else { ctx.moveTo(-14, -2); ctx.lineTo(-24, 22 + sw); ctx.moveTo(14, -2); ctx.lineTo(24, 22 - sw); }
  ctx.stroke();
  // cabeza
  ellipse(0, -28, 26, 25, "#ffe0c7", "#e8b99a");
  // pelo
  ctx.beginPath(); ctx.arc(0, -32, 27, Math.PI, 0); ctx.lineTo(27, -30); ctx.quadraticCurveTo(10, -44, -4, -30);
  ctx.quadraticCurveTo(-18, -40, -27, -30); ctx.closePath(); ctx.fillStyle = "#6b3f2a"; ctx.fill();
  // moñitos
  ellipse(-28, -40, 7, 7, "#ff6fa5"); ellipse(28, -40, 7, 7, "#ff6fa5");
  // cara
  ctx.fillStyle = "#333"; ctx.strokeStyle = "#333"; ctx.lineWidth = 2.5;
  const ex = dir * 4;
  if (hugging) {
    [-10, 10].forEach(e => { ctx.beginPath(); ctx.arc(e + ex, -26, 4, Math.PI, 0); ctx.stroke(); });
  } else { ellipse(-10 + ex, -26, 3, 4, "#222"); ellipse(10 + ex, -26, 3, 4, "#222"); }
  ellipse(-16 + ex, -18, 5, 3, "rgba(255,120,150,.5)"); ellipse(16 + ex, -18, 5, 3, "rgba(255,120,150,.5)");
  ctx.beginPath(); ctx.arc(ex, -17, hugging ? 7 : 5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();
}

function bubbleAt(text, x, y) {
  ctx.font = "bold 17px 'Trebuchet MS', sans-serif";
  const w = ctx.measureText(text).width + 28, h = 36;
  const bx = Math.max(8, Math.min(W - w - 8, x - w / 2)), by = y - h;
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#ff8fb8"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 8, by + h - 1); ctx.lineTo(x, by + h + 12); ctx.lineTo(x + 8, by + h - 1);
  ctx.fillStyle = "#fff"; ctx.fill();
  ctx.fillStyle = "#7a3b5a"; ctx.textAlign = "center"; ctx.fillText(text, bx + w / 2, by + 24);
}

function drawHUD() {
  ctx.textAlign = "left"; ctx.font = "bold 20px 'Trebuchet MS', sans-serif"; ctx.fillStyle = "#7a3b5a";
  ctx.fillText("🤗 Abrazos: " + hugs, 18, 32);
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.roundRect(18, 44, 200, 18, 9); ctx.fill();
  ctx.fillStyle = "#ff6fa5"; ctx.beginPath(); ctx.roundRect(18, 44, Math.max(10, love * 2), 18, 9); ctx.fill();
  ctx.strokeStyle = "#ff8fb8"; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(18, 44, 200, 18, 9); ctx.stroke();
  ctx.font = "13px sans-serif"; ctx.fillStyle = "#7a3b5a"; ctx.fillText("💗 Amor", 226, 58);
  if (hint > 0) {
    ctx.textAlign = "center"; ctx.font = "bold 16px sans-serif"; ctx.fillStyle = "#d95f90";
    ctx.fillText("¡Acercate más al gatito!", zoe.x, zoe.y - 100);
  }
  if (toast.t > 0) {
    ctx.globalAlpha = Math.min(1, toast.t);
    ctx.font = "bold 22px 'Trebuchet MS', sans-serif";
    const w = ctx.measureText(toast.text).width + 40;
    ctx.fillStyle = "#fff7c2"; ctx.strokeStyle = "#ffc94d"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.roundRect(W / 2 - w / 2, 90, w, 50, 16); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#a15a00"; ctx.textAlign = "center"; ctx.fillText(toast.text, W / 2, 123);
    ctx.globalAlpha = 1;
  }
}

function draw() {
  drawBackground();
  // nombres + dibujo ordenados por profundidad
  const order = zoe.y < cat.y ? [drawZoe, drawCat] : [drawCat, drawZoe];
  order.forEach(f => f());
  ctx.textAlign = "center"; ctx.font = "bold 14px sans-serif"; ctx.fillStyle = "#7a3b5a";
  ctx.fillText(CAT_NAME, cat.x, cat.y + 68); ctx.fillText(ZOE_NAME, zoe.x, zoe.y + 82);
  hearts.forEach(h => { ctx.globalAlpha = Math.min(1, h.life); ctx.font = h.s + "px sans-serif"; ctx.fillText(h.c, h.x, h.y); });
  ctx.globalAlpha = 1;
  if (bubble.t > 0) bubbleAt(bubble.text, cat.x, cat.y - 85);
  drawHUD();
}

// ================== LOOP ==================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
</body>
</html>
